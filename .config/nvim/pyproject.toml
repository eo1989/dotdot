[project]
name = "dotdot"
requires-python = ">=3.12"
dynamic = ["version"]

# [tool.poetry]
# python = "^3.12"                          # "^3.12"
# build = "poetry build"
# files = ["pyproject.toml", "poetry.lock"]

[tool.basedpyright]
# exclude = ["**/node_modules", "**/__pycache__", "**/rplugin"]
# ignore = ["rplugin/**"]
reportMissingImports = false  # ruff will already do these
reportMissingTypeStubs = false
pythonVersion = ">=3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "off"
useLibraryCodeForTypes = true

[tool.black]
line-length = 80
target-version = ["py312", "py313", "py314"]

[tool.mdformat]
number = true

[tool.ruff]
line-length = 80
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

[tool.ruff.lint]
# fixable = ["ALL"]
fixable = ["E", "F"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
extend-select = ["UP"]
ignore = [
  "COM",
  "ISC",
  "I",
  "NPY",
  "INP",
  "PIE",
  "F4",
  "F8",
  "E4",
  "E5",
  "E7",
  "E9",
  "W",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

# blank-line-before-module-docstring = true
# trailing-comma = true

[tool.rumdl]
# Global configuration options
line-length = 100
disable = []
exclude = [
  # Common directories to exclude
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  ".venv",
  ".ruff_cache",
  ".pytest_cache",
  ".CondaPkg",
  ".ipynb_checkpoints",
  ":-",
  "__pycache__",
  "*_files",
]
respect-gitignore = true

# Rule-specific configurations (uncomment and modify as needed)

# [tool.rumdl.MD003]
# style = "atx"  # Heading style (atx, atx_closed, setext)

# [tool.rumdl.MD004]
# style = "asterisk"  # Unordered list style (asterisk, plus, dash, consistent)

# [tool.rumdl.MD007]
# indent = 4  # Unordered list indentation

[tool.rumdl.MD013]
line-length = 100  # Line length
code-blocks = true  # Exclude code blocks from line length check
tables = true  # Exclude tables from line length check
headings = true  # Include headings in line length check

[tool.rumdl.MD044]
# names = ["rumdl", "Markdown", "GitHub"]  # Proper names that should be capitalized correctly
code-blocks = false  # Check code blocks for proper names (default: false, skips code blocks)

[tool.typos.default]
extend-ignore-re = [
  # Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
  ".*(?:#|--|//|/*).*(?:spellchecker|typos):\\s?ignore[^\\n]*\\n",
  ".*(?:spellchecker|typos):\\s?ignore-next-line[^\\n]*\\n[^\\n]*",
]
